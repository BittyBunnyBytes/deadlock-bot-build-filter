<!-- Bot Build Filter: the lookup page, served by this repo GitHub Pages.
     The mod opens it in a hidden game web view with "#<request>" and reads the answer from the title.
     Requests: stats (authors W/L on a hero), builds (texts + favourites of authors builds for a hero),
     top (a hero builds in a sort order), favs (a hero most favourited builds),
     load/save (the mod settings), clear (forget saved lookups). All kept in this page localStorage.
     Answers are saved and reused for the keep-time the mod sends; requests to deadlock-api are limited to
     2 at once / 4 a second, and 429/503 Retry-After waits are honoured (and remembered).
     To use your own copy, host this file over https and set CONFIG.stats.relayUrl. -->
<!doctype html><meta charset="utf-8"><title>BBF</title><script>(function(){var API="https://api.deadlock-api.com/v1/";function T(){return Date.now()/1000}function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return("0000000"+h.toString(16)).slice(-8)}function send(r,s){var n=Math.max(1,Math.ceil(s.length/3500)),i=0;if(n===1){document.title="BBF1|"+r+"|ok|"+s;return}(function next(){if(i>=n)return;document.title="BBF1|"+r+"|"+i+"/"+n+"|"+s.slice(i*3500,(i+1)*3500);i++;setTimeout(next,15)})()}function fail(r,e){document.title="BBF1|"+r+"|err|"+((e&&e.message)||e)}function rd(k){try{return JSON.parse(localStorage.getItem(k)||"null")}catch(e){return null}}function drop(keep){try{for(var i=localStorage.length-1;i>=0;i--){var k=localStorage.key(i);if(k&&k.indexOf("bbf_c_")===0&&k!==keep)localStorage.removeItem(k)}}catch(e){}}function wr(k,v){var s=JSON.stringify(v);try{localStorage.setItem(k,s)}catch(e){drop(k);try{localStorage.setItem(k,s)}catch(e2){}}}var act=0,last=0,wq=[];function pump(){if(!wq.length||act>=2)return;var d=last+0.25-T();if(d>0){setTimeout(pump,Math.ceil(d*1000));return}act++;last=T();wq.shift()();pump()}function wait(){var c=rd("bbf_wait")||0;return c>T()?Math.ceil(c-T()):0}function after(r,d){var s=Number(r.headers&&r.headers.get("Retry-After"));return s>0?Math.min(s,3600):d}function get(u){var c=wait();if(c)return Promise.reject(new Error("RATE "+c));var bad=rd("bbf_bad")||{};if(bad[u]>T())return Promise.reject(new Error("HTTP 504, not asked again for "+Math.ceil(bad[u]-T())+"s"));return new Promise(function(ok){wq.push(ok);pump()}).then(function(){return fetch(u).then(function(r){act--;pump();return r},function(){act--;pump();wr("bbf_wait",T()+20);throw new Error("RATE 20")})}).then(function(r){if(r.status===429||r.status===503){var s=after(r,60);wr("bbf_wait",T()+s);throw new Error("RATE "+s)}if(r.status===504){var b=rd("bbf_bad")||{},n=T();for(var k in b)if(b[k]<n)delete b[k];b[u]=n+after(r,300
