<!doctype html><meta charset="utf-8"><title>BBF</title><script>(function(){function t(s){document.title=s}function run(){var P;try{P=JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch(e){return}var u="https://api.deadlock-api.com/v1/players/hero-stats?account_ids="+P.ids.join(",")+"&hero_ids="+P.hero;fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()}).then(function(a){var o=[];for(var i=0;i<a.length;i++){var x=a[i];if(x.hero_id==P.hero)o.push(x.account_id+":"+(x.wins|0)+":"+(x.matches_played|0))}t("BBF1|"+P.r+"|ok|"+o.join(","))}).catch(function(e){t("BBF1|"+P.r+"|err|"+((e&&e.message)||e))})}window.addEventListener("hashchange",run);run()})()</script>
