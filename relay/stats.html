<!-- Bot Build Filter: the lookup page, served by this repo's GitHub Pages.
     The mod opens it in a hidden game web view with "#<request>" and reads the answer from the title.
     Requests: stats (authors W/L on a hero), builds (texts + favourites of authors builds for a hero),
     favs (a hero most favourited builds), load/save (the mod settings, kept in this page localStorage).
     To use your own copy, host this file over https and set CONFIG.stats.relayUrl. -->
<!doctype html><meta charset="utf-8"><title>BBF</title><script>(function(){var API="https://api.deadlock-api.com/v1/";function fnv(s){var h=0x811c9dc5;for(var i=0;i<s.length;i++){h^=s.charCodeAt(i);h=Math.imul(h,16777619)>>>0}return("0000000"+h.toString(16)).slice(-8)}function send(r,s){var n=Math.max(1,Math.ceil(s.length/3500)),i=0;if(n===1){document.title="BBF1|"+r+"|ok|"+s;return}(function next(){if(i>=n)return;document.title="BBF1|"+r+"|"+i+"/"+n+"|"+s.slice(i*3500,(i+1)*3500);i++;setTimeout(next,15)})()}function fail(r,e){document.title="BBF1|"+r+"|err|"+((e&&e.message)||e)}function get(u){return fetch(u).then(function(r){if(!r.ok)throw new Error("HTTP "+r.status);return r.json()})}function run(){var P;try{P=JSON.parse(decodeURIComponent(location.hash.slice(1)))}catch(e){return}if(P.cmd==="load"){var v="";try{v=localStorage.getItem("bbf_settings")||""}catch(e){}send(P.r,v);return}if(P.cmd==="save"){try{localStorage.setItem("bbf_settings",JSON.stringify(P.settings))}catch(e){}send(P.r,"saved");return}if(P.cmd==="builds"){var out=[],q=P.authors.slice(),busy=0;function one(){if(!q.length){if(!busy)send(P.r,JSON.stringify(out));return}var a=q.shift();busy++;get(API+"builds?hero_id="+P.hero+"&author_id="+a+"&only_latest=true").then(function(l){for(var i=0;i<l.length;i++){var h=l[i].hero_build||{},d=h.details||{},c=d.mod_categories||[],notes=[],cats=[];for(var j=0;j<c.length;j++){cats.push((c[j].name||"")+" "+(c[j].description||""));var m=c[j].mods||[];for(var k=0;k<m.length;k++)if(m[k].annotation)notes.push(String(m[k].annotation).slice(0,80))}out.push([String(h.author_account_id),String(h.name||""),h.hero_build_id|0,l[i].num_favorites|0,l[i].num_weekly_favorites|0,String(h.description||"").slice(0,400),notes.slice(0,30),cats.join("\n").slice(0,400),h.last_updated_timestamp|0])}}).catch(function(){out.push(["!",String(a)])}).then(function(){busy--;one()})}for(var w=0;w<6;w++)one();return}if(P.cmd==="favs"){get(API+"builds?hero_id="+P.hero+"&only_latest=true&sort_by=favorites&sort_direction=desc&limit="+(P.limit|0||400)).then(function(a){var o=[],min=-1;for(var i=0;i<a.length;i++){var b=a[i],h=b.hero_build||{},f=b.num_favorites|0;min=min<0?f:Math.min(min,f);o.push(h.author_account_id+":"+fnv(String(h.name||""))+":"+f+":"+(b.num_weekly_favorites|0))}send(P.r,"min:"+min+","+o.join(","))}).catch(function(e){fail(P.r,e)});return}get(API+"players/hero-stats?account_ids="+P.ids.join(",")+"&hero_ids="+P.hero).then(function(a){var o=[];for(var i=0;i<a.length;i++){var x=a[i];if(x.hero_id==P.hero)o.push(x.account_id+":"+(x.wins|0)+":"+(x.matches_played|0))}send(P.r,o.join(","))}).catch(function(e){fail(P.r,e)})}window.addEventListener("hashchange",run);run()})()</script>
